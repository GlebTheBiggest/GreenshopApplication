services:
  postgres-db:
    image: postgres:15
    container_name: greenshop_db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: greenshop_db
      PGPORT: 5433
    ports:
      - "5433:5433"
    restart: always

  redis:
    image: redis:7-alpine
    container_name: greenshop_redis
    ports:
      - "6379:6379"
    restart: always

  kafka:
    image: apache/kafka:3.8.0
    container_name: greenshop_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: always

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: greenshop_mailhog
    ports:
      - "1025:1025" # SMTP - сюди застосунок надсилає листи
      - "8025:8025" # Web UI - тут дивимось, що "надійшло"
    restart: always