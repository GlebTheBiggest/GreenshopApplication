services:
  postgres-db:
    image: postgres:15
    container_name: greenshop_db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: greenshop_db
      PGPORT: 5433
    ports:
      - "5433:5433"
    restart: always

  redis:
    image: redis:7-alpine
    container_name: greenshop_redis
    ports:
      - "6379:6379"
    restart: always